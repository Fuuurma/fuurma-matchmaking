name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify generated Worker types
        run: pnpm exec wrangler types --check
      - name: Type-check
        run: pnpm run check
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Deployment preflight
        run: pnpm run deploy:check
